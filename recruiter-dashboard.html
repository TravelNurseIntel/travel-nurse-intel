<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Recruiter Dashboard | Travel Nurse Intel</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50">

<div id="header"></div>
<script src="/components/load-header.js"></script>

<main class="max-w-6xl mx-auto p-6">

<h1 class="text-3xl font-bold mb-6">
Recruiter Dashboard
</h1>

<!-- 🔥 ACTION BAR (NEW - HIGH VALUE) -->

<div class="grid md:grid-cols-3 gap-4 mb-10">

<button onclick="getPrediction()" class="bg-blue-600 text-white p-4 rounded-lg font-semibold hover:bg-blue-700">
Get Pay Recommendation
</button>

<a href="/travel-nurse-market-intelligence.html"
class="bg-gray-800 text-white p-4 rounded-lg font-semibold text-center hover:bg-gray-900">
View Market Insights
</a>

<button onclick="optimizePay()" class="bg-green-600 text-white p-4 rounded-lg font-semibold hover:bg-green-700">
Optimize Contract Pay
</button>

</div>

<!-- METRICS -->

<div class="grid md:grid-cols-3 gap-6 mb-10">

<div class="bg-white p-6 rounded-xl shadow">
<h3 class="font-bold text-lg mb-2">Active Contracts</h3>
<p class="text-4xl font-bold">42</p>
</div>

<div class="bg-white p-6 rounded-xl shadow">
<h3 class="font-bold text-lg mb-2">Fill Probability</h3>
<p class="text-4xl font-bold text-green-600">78%</p>
</div>

<div class="bg-white p-6 rounded-xl shadow">
<h3 class="font-bold text-lg mb-2">Average Pay Rank</h3>
<p class="text-4xl font-bold">Top 20%</p>
</div>

</div>

<!-- PAY PREDICTION RESULT -->

<div class="bg-white p-6 rounded-xl shadow mb-10">
<h2 class="text-xl font-bold mb-4">Pay Recommendation</h2>

<div class="grid md:grid-cols-2 gap-4 mb-4">

<input id="city" placeholder="City" class="p-3 border rounded">
<input id="specialty" placeholder="Specialty" class="p-3 border rounded">

</div>

<p id="predictionResult" class="text-xl font-bold text-green-600"></p>

</div>

<!-- POST CONTRACT -->

<h2 class="text-xl font-bold mb-4">
Post Travel Nurse Contract
</h2>

<form id="jobForm" class="grid md:grid-cols-2 gap-4 mb-10">

<input name="title" placeholder="Job Title" class="p-3 border rounded" required>

<input name="hospital" placeholder="Hospital Name" class="p-3 border rounded">

<input name="city" placeholder="City" class="p-3 border rounded" required>

<input name="state" placeholder="State" class="p-3 border rounded">

<input name="specialty" placeholder="Specialty" class="p-3 border rounded">

<input name="pay" type="number" placeholder="Weekly Pay" class="p-3 border rounded" required>

<button class="col-span-2 bg-blue-600 text-white p-3 rounded hover:bg-blue-700">
Post Contract
</button>

</form>

<!-- BULK CSV UPLOAD -->

<h2 class="text-xl font-bold mb-4">
Bulk Contract Upload (CSV)
</h2>

<input type="file" id="csvUpload" class="mb-4">

<button onclick="uploadCSV()" class="bg-green-600 text-white p-3 rounded hover:bg-green-700">
Upload CSV
</button>

</main>

<div id="footer"></div>
<script src="/components/load-footer.js"></script>

<script>

/* 🔥 PAY PREDICTION */

async function getPrediction(){

const city = document.getElementById("city").value.trim()
const specialty = document.getElementById("specialty").value.trim()

if(!city || !specialty){
alert("Enter city and specialty")
return
}

const apiKey = localStorage.getItem("apiKey")

if(!apiKey){
alert("Upgrade required")
return
}

try{

const res = await fetch(`/api/predict-pay?city=${encodeURIComponent(city)}&specialty=${encodeURIComponent(specialty)}`,{
headers: {
"x-api-key": apiKey
}
})

if(res.status === 403){
alert("Upgrade to access this feature")
return
}

const data = await res.json()

document.getElementById("predictionResult").innerText =
`Recommended Pay: $${data.recommendedPay}/week`

}catch(err){

console.error(err)
alert("Prediction failed")

}

}

/* 🔥 OPTIMIZE PAY (SIMPLE UPGRADE HOOK) */

function optimizePay(){

alert("Optimization engine coming next — upgrade required")

}

/* 📄 POST CONTRACT */

document.getElementById("jobForm").addEventListener("submit", async function(e){

e.preventDefault()

const formData = new FormData(this)

const payload = {
title: formData.get("title"),
hospital: formData.get("hospital"),
city: formData.get("city"),
state: formData.get("state"),
specialty: formData.get("specialty"),
pay: Number(formData.get("pay")) || 0
}

try{

await fetch("/api/jobs",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify(payload)
})

alert("Job posted successfully")

}catch(err){

console.error(err)
alert("Failed to post job")

}

})

/* 📊 CSV UPLOAD */

async function uploadCSV(){

const file = document.getElementById("csvUpload").files[0]

if(!file){
alert("Please select a CSV file")
return
}

try{

const text = await file.text()

await fetch("/api/jobs-upload",{
method:"POST",
headers:{ "Content-Type":"text/plain" },
body:text
})

alert("Bulk upload complete")

}catch(err){

console.error(err)
alert("Upload failed")

}

}

</script>

</body>
</html>
