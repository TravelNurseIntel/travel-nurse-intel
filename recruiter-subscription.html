<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recruit Travel Nurses | Travel Nurse Intel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 p-6">

<div class="max-w-5xl mx-auto bg-white p-10 rounded-xl shadow text-center">

<h1 class="text-3xl font-bold mb-4">
Recruit Travel Nurses Directly
</h1>

<p class="text-gray-700 mb-8">
Access real-time market intelligence, pay recommendations, and fill contracts faster.
</p>

<div class="grid md:grid-cols-3 gap-6">

<!-- STARTER -->
<div class="border p-6 rounded-lg">
<h2 class="text-xl font-bold mb-2">Starter</h2>
<p class="text-gray-600 mb-4">Market insights + pay analytics</p>
<p class="text-2xl font-bold mb-4">$599/mo</p>

<button onclick="subscribe('starter')" 
class="bg-blue-600 text-white px-5 py-3 rounded hover:bg-blue-700 w-full">
Start Starter Plan
</button>
</div>

<!-- STANDARD -->
<div class="border p-6 rounded-lg">
<h2 class="text-xl font-bold mb-2">Standard</h2>
<p class="text-gray-600 mb-4">Unlimited contract postings</p>
<p class="text-2xl font-bold mb-4">$999/mo</p>

<button onclick="subscribe('standard')" 
class="bg-blue-600 text-white px-5 py-3 rounded hover:bg-blue-700 w-full">
Start Standard Plan
</button>
</div>

<!-- ENTERPRISE -->
<div class="border p-6 rounded-lg">
<h2 class="text-xl font-bold mb-2">Enterprise</h2>
<p class="text-gray-600 mb-4">Full analytics + priority exposure</p>
<p class="text-2xl font-bold mb-4">$3999/mo</p>

<button onclick="contactSales()" 
class="bg-gray-800 text-white px-5 py-3 rounded hover:bg-gray-900 w-full">
Contact Enterprise Sales
</button>

</div>

</div>

</div>

<script>

/* 🔐 SUBSCRIPTION */

async function subscribe(plan){

const email = prompt("Enter your email")

if(!email) return

try{

const res = await fetch("/api/create-key",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body: JSON.stringify({ email, plan })
})

if(!res.ok){
throw new Error("Request failed")
}

const data = await res.json()

if(!data.apiKey){
alert("Subscription failed")
return
}

localStorage.setItem("apiKey", data.apiKey)

alert("Subscription activated")

}catch(err){

console.error(err)
alert("Error creating subscription")

}

}

/* 📞 ENTERPRISE CONTACT */

function contactSales(){

alert("Enterprise sales team will contact you shortly. Please email support@travelnurseintel.com")

}

</script>

</body>
</html>
